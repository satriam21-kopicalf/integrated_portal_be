services:
  api:
    build: .
    image: integrated-portal-be:latest
    container_name: integrated-portal-be
    env_file: .env
    ports:
      - "8002:8002"
    # the HRMS API (kopicalf-hr-api, port 8001 of this VPS) for /api/auth/hrms-exchange
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Generated Excel exports (auto-deleted after EXPORT_TTL_HOURS)
      - exports:/data/exports
      # Damaged Equipment photos & videos (app/damaged_equipment.py), kept for good
      - media:/data/media
      # the HRMS attendance selfies (kopicalf-hr-api uploads), read only: the photo of a PIC Check In made from a punch-in
      - hrms_uploads:/data/hrms_uploads:ro
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  exports:
  media:
  hrms_uploads:
    external: true
    name: kopicalf-hr_hr_uploads
